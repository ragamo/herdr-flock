id = "flock.farm"
name = "Flock"
version = "0.1.0"
min_herdr_version = "0.7.0"

[[panes]]
id = "farm"
title = "Flock Farm"
placement = "overlay"
command = ["herdr-flock"]

[[events]]
on = "pane.agent_detected"
command = ["herdr-flock", "--event", "agent-born"]

[[events]]
on = "pane.agent_status_changed"
command = ["herdr-flock", "--event", "agent-status"]
