[package]
name = "herdr-flock"
version = "0.1.0"
edition = "2024"
description = "A herdr plugin that visualizes agents as sheep in a top-down farm"
license = "MIT"
repository = "https://github.com/ragamo/herdr-flock"
keywords = ["herdr", "plugin", "tui", "agents"]
categories = ["command-line-utilities", "visualization"]

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
dirs = "5"
unicode-width = "0.1"
rusqlite = { version = "0.31", features = ["bundled"] }
